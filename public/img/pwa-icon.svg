<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="38%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1b2140"/>
      <stop offset="55%" stop-color="#111530"/>
      <stop offset="100%" stop-color="#060819"/>
    </radialGradient>
    <radialGradient id="nebulaViolet" cx="30%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaTeal" cx="75%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#0e9db8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0e9db8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaMagenta" cx="55%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b7cff"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="dGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a8b6ff"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8ecff"/>
      <stop offset="35%" stop-color="#8b7cff"/>
      <stop offset="100%" stop-color="#221b4e"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- rounded icon background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- nebula clouds -->
  <ellipse cx="140" cy="150" rx="180" ry="120" fill="url(#nebulaViolet)"/>
  <ellipse cx="380" cy="330" rx="190" ry="130" fill="url(#nebulaTeal)"/>
  <ellipse cx="270" cy="230" rx="170" ry="110" fill="url(#nebulaMagenta)"/>

  <!-- stars -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="92" cy="70" r="1.6"/><circle cx="180" cy="46" r="1.1"/>
    <circle cx="300" cy="66" r="1.9"/><circle cx="415" cy="120" r="1.3"/>
    <circle cx="440" cy="235" r="1.7"/><circle cx="96" cy="255" r="1.2"/>
    <circle cx="392" cy="430" r="1.5"/><circle cx="160" cy="425" r="1.9"/>
    <circle cx="262" cy="462" r="1.2"/><circle cx="74" cy="335" r="1.4"/>
    <circle cx="216" cy="118" r="1.1"/><circle cx="330" cy="160" r="1.4"/>
    <circle cx="140" cy="330" r="1.1"/><circle cx="462" cy="60" r="1.6"/>
  </g>

  <!-- orbit ring -->
  <ellipse cx="256" cy="256" rx="152" ry="88" transform="rotate(-24 256 256)"
           fill="none" stroke="url(#ring)" stroke-width="20" stroke-linecap="round" opacity="0.95"/>

  <!-- letter D built from arc -->
  <g filter="url(#glow)">
    <path fill="none" stroke="url(#dGrad)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"
          d="M 226 150 V 362 M 226 150 C 330 150 360 210 360 256 C 360 302 330 362 226 362"/>
  </g>

  <!-- core nucleus -->
  <circle cx="360" cy="256" r="16" fill="url(#core)" filter="url(#glow)"/>
</svg>
